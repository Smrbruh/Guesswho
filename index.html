<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Угадай кто — Атака титанов</title>
<style>
:root{--wood1:#8a5a33;--wood2:#7a4e2c;--felt:#1f6b4a;--felt2:#2c8660;--cream:#f6ecd2;--ink:#2b1d12;--plastic:#d9402f;--plastic2:#ff7a63;--card:#e9dcc0;--cb:#c9a56b;--yel:#ffd43b;--accent:#d9402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wood1:#5c3b21;--wood2:#4f321b;--felt:#15503a;--felt2:#1e6a4d;--cream:#e8dcc0}}
:root[data-theme="dark"]{--wood1:#5c3b21;--wood2:#4f321b;--felt:#15503a;--felt2:#1e6a4d;--cream:#e8dcc0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px 14px 40px;color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;font-size:13px;position:relative;overflow-x:hidden;
background:radial-gradient(ellipse at 50% 30%,transparent 40%,rgba(0,0,0,.4)),repeating-linear-gradient(92deg,var(--wood1) 0 9px,var(--wood2) 9px 11px,var(--wood1) 11px 26px,#6e4526 26px 27px)}
.stain{position:absolute;left:2%;bottom:10px;width:120px;height:120px;border-radius:50%;border:7px solid rgba(40,20,5,.35);box-shadow:inset 0 0 6px rgba(40,20,5,.3);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:44px;opacity:.9}
.game{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start;position:relative}
.board{background:radial-gradient(circle at 50% 40%,var(--felt2),var(--felt));border:12px solid var(--cream);border-radius:22px;box-shadow:0 0 0 4px var(--ink),0 18px 0 -2px rgba(0,0,0,.35),0 24px 30px rgba(0,0,0,.45);padding:14px}
.lid{text-align:center;margin-bottom:14px}
h1{margin:0;font:900 40px/1 Impact,"Arial Black",sans-serif;letter-spacing:3px;color:var(--yel);text-shadow:3px 3px 0 var(--plastic),6px 6px 0 var(--ink);transform:rotate(-2deg);display:inline-block}
.ribbon{display:inline-block;margin-top:10px;background:var(--cream);padding:3px 12px;border:2px solid var(--ink);border-radius:4px;font-size:11px;font-weight:bold;transform:rotate(1deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 12px;padding:6px}
.grid.picking .card{animation:wob .5s infinite alternate}
@keyframes wob{to{transform:rotate(calc(var(--r) + 2deg)) scale(1.03)}}
.card{perspective:700px;position:relative;border:0;padding:5px 5px 0;background:var(--cb);border-radius:9px 9px 4px 4px;font:inherit;color:inherit;text-align:center;cursor:pointer;transform:rotate(var(--r,0deg));transition:transform .15s;box-shadow:0 5px 0 #8c6a35,0 9px 10px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent}
.card:hover{transform:translateY(-4px) rotate(calc(var(--r,0deg)*-1))}
.face{background:var(--card);border-radius:5px 5px 0 0;overflow:hidden}
.face svg,.face img{display:block;width:100%;aspect-ratio:5/6;object-fit:cover}
.name{font-size:11px;font-weight:bold;padding:4px 2px 5px;line-height:1.15;background:var(--cream);border-top:2px solid var(--cb)}
.flap{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:9px 9px 4px 4px;background:linear-gradient(160deg,var(--plastic2),var(--plastic) 45%,#a82a1c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),0 6px 8px rgba(0,0,0,.5);transform-origin:top;transform:rotateX(-100deg);opacity:0;pointer-events:none;transition:transform .55s cubic-bezier(.3,1.7,.5,1),opacity .15s;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font:900 40px Impact,sans-serif;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.flap small{font:bold 9px "Trebuchet MS",sans-serif;letter-spacing:2px}
.card.closed .flap{transform:rotateX(0);opacity:1}
.card.closed{transform:rotate(var(--r,0deg)) scale(.97)}
.card.last{outline:4px solid var(--yel);outline-offset:3px;animation:hop .6s infinite alternate}
@keyframes hop{to{transform:translateY(-8px) rotate(var(--r,0deg))}}
.rules{margin:12px 6px 2px;background:var(--cream);border:2px solid var(--ink);border-radius:6px;padding:7px 10px;font-size:12px;font-weight:bold;transform:rotate(-.4deg);box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.side{display:flex;flex-direction:column;gap:14px}
.stand{background:#c9a56b;border:3px solid var(--ink);border-radius:8px;padding:26px 12px 12px;position:relative;box-shadow:5px 6px 0 rgba(0,0,0,.4);transform:rotate(1deg)}
.stand::before{content:"";position:absolute;top:-10px;left:50%;width:90px;height:22px;margin-left:-45px;background:rgba(255,236,150,.7);transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.stand h2{margin:0 0 8px;font:900 15px Impact,sans-serif;letter-spacing:1px;text-align:center}
#secret{background:var(--felt);border:3px inset var(--wood2);border-radius:6px;padding:8px;min-height:176px;display:flex;align-items:center;justify-content:center}
#secret .face{width:130px;border:5px solid var(--cb);border-radius:6px;transform:rotate(-2deg);box-shadow:0 5px 10px rgba(0,0,0,.5)}
#secret.hidden .face{filter:blur(13px)}
#secret .empty{color:var(--cream);text-align:center;font-weight:bold;font-size:12px}
.btn{display:block;width:100%;margin-top:9px;font:bold 13px "Trebuchet MS",sans-serif;padding:9px 6px;color:var(--ink);background:var(--yel);border:3px solid var(--ink);border-radius:10px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.alt{background:var(--cream)}
#dice{display:inline-block}
#dice.roll{animation:spin .7s linear}
@keyframes spin{to{transform:rotate(900deg) scale(1.5)}}
.score{display:flex;align-items:center;gap:12px;background:var(--cream);border:3px solid var(--ink);border-radius:10px;padding:10px;box-shadow:4px 5px 0 rgba(0,0,0,.4);font-weight:bold}
.chip{width:58px;height:58px;border-radius:50%;background:var(--plastic);border:4px dashed var(--cream);box-shadow:0 0 0 3px var(--plastic),0 4px 0 3px #7a1c10;color:#fff;display:flex;align-items:center;justify-content:center;font:900 24px Impact,sans-serif}
#msg{margin-top:4px;color:var(--accent);font-weight:900;border:3px solid var(--accent);padding:2px 6px;border-radius:4px;transform:rotate(-4deg);display:inline-block;font-size:13px}
#msg:empty{display:none}
.sticky{background:#fff176;padding:12px 10px;font:italic bold 13px "Comic Sans MS","Trebuchet MS",sans-serif;box-shadow:4px 6px 8px rgba(0,0,0,.4);transform:rotate(-2.5deg);min-height:70px;clip-path:polygon(0 0,100% 0,100% 88%,92% 100%,0 100%)}
@media (max-width:820px){.game{grid-template-columns:1fr}.side{order:-1}h1{font-size:30px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="stain">☕</div>
<div class="game">
<div class="board">
<div class="lid"><h1>УГАДАЙ КТО?</h1><br><span class="ribbon">Издание: «Атака титанов» · 2 игрока · 10+ · нервы в комплект не входят</span></div>
<div class="grid" id="grid"></div>
<div class="rules" id="hint"></div>
</div>
<aside class="side">
<div class="stand">
<h2>🤫 ТОЛЬКО ДЛЯ ВАС</h2>
<div id="secret"></div>
<button class="btn" id="pick">Выбрать самому</button>
<button class="btn" id="rand"><span id="dice">🎲</span> Случайный</button>
<button class="btn alt" id="peek">Скрыть</button>
</div>
<div class="score"><div class="chip" id="left"></div><div>Осталось подозреваемых<div id="msg"></div></div></div>
<div class="sticky" id="note">Положите карточку лицом к себе. Шпионы — в стену!</div>
<button class="btn alt" id="reset">Поднять все карточки</button>
<button class="btn alt" id="photo">Загрузить фото</button>
<input type="file" id="file" accept="image/*" hidden>
</aside>
</div>
<script>
const SERIES={name:"Атака титанов",chars:[
{n:"Эрен Йегер", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/3/3c/Eren_Jaeger_%28Anime%29_character_image_%28850%29.png"},
{n:"Микаса Аккерман", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/4/4f/Mikasa_Ackermann_%28Anime%29_character_image.png"},
{n:"Армин Арлерт", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/9/93/Armin_Arlelt_%28Anime%29_character_image.png"},
{n:"Леви Аккерман", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/8/8d/Levi_Ackermann_%28Anime%29_character_image_%28854%29.jpg"},
{n:"Эрвин Смит", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/d/de/Erwin_Smith_%28Anime%29_character_image.png"},
{n:"Райнер Браун", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/6/6d/Reiner_Braun_%28Anime%29_character_image.png"},
{n:"Бертольд Гувер", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/5/56/Bertholdt_Hoover_%28Anime%29_character_image.png"},
{n:"Энни Леонхарт", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/8/80/Annie_Leonhart_%28Anime%29_character_image_%28850%29.png"},
{n:"Жан Кирштайн", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/3/38/Jean_Kirschtein_%28Anime%29_character_image.png"},
{n:"Конни Спрингер", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/c/c7/Conny_Springer_%28Anime%29_character_image_%28854%29.png"},
{n:"Саша Браус", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/c/ca/Sasha_Braus_%28Anime%29_character_image_%28850%29.png"},
{n:"Хистория Рейсс", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/6/65/Historia_Reiss_%28Anime%29_character_image.png"},
{n:"Имир", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/4/43/Ymir_%28Anime%29_character_image.png"},
{n:"Ханджи Зоэ", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/e/e4/Hange_Zo%C3%AB_%28Anime%29_character_image.png"},
{n:"Зик Йегер", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/d/d9/Zeke_Jaeger_%28Anime_2%29_character_image.jpg"},
{n:"Гриша Йегер", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/3/33/Grisha_Jaeger_%28Anime%29_character_image.png"},
{n:"Габи Браун", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/6/6a/Gabi_Braun_%28Anime%29_character_image_2.png"},
{n:"Пик Фингер", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/1/10/Pieck_%28Anime%29_character_image.png"},
{n:"Порко Галлиард", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/0/0c/Porco_Galliard_%28Anime%29_character_image.png"},
{n:"Флок Форстер", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/3/3b/Floch_Forster_%28Anime%29_character_image.png"},
{n:"Кенни Аккерман", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/e/ee/Kenny_Ackermann_%28Anime%29_character_image.png"},
{n:"Фалько Грайс", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/5/5a/Falco_Grice_%28Anime%29_character_image.png"},
{n:"Дот Пиксис", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/0/0f/Dot_Pyxis_%28Anime%29_character_image.png"},
{n:"Марко Ботт", img:"https://static.wikia.nocookie.net/shingekinokyojin/images/9/9a/Marco_Bodt_%28Anime%29_character_image.png"}
]};

const $=s=>document.querySelector(s);
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function svgFallback(name){
 const h=hue(name),ini=name.split(" ").map(w=>w[0]).join("");
 return `<svg viewBox="0 0 100 120" role="img" aria-label="${name}"><rect width="100" height="120" fill="hsl(${h} 25% 82%)"/><circle cx="50" cy="48" r="20" fill="hsl(${h} 22% 62%)"/><path d="M12 120c0-26 16-40 38-40s38 14 38 40z" fill="hsl(${h} 30% 48%)"/><text x="50" y="54" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" fill="#fff" font-weight="600">${ini}</text></svg>`;
}
function avatar(c){
 if(c.img)return `<img src="${c.img}" alt="${c.n}" onerror="this.outerHTML=svgFallback('${c.n}')">`;
 return svgFallback(c.n);
}
const face=c=>`<div class="face bevel">${avatar(c)}<div class="name">${c.n}</div></div>`;
const Q={close:["Мимо! Этот не ваш.","Щёлк! Пластик сказал «ку».","Леви одобряет чистоту на столе.","Ещё один в минус. Как будто Титан наступил.","Эрвин: «Вперёд!» Карточка: «Вниз»."],open:["Воскрес! Прямо как Эрен.","Передумали? Бывает.","Вернули в строй."],pick:["Секрет спрятан. Не пялься, оппонент!","Загадано. Делайте вид, что вам всё равно.","Ваш персонаж в бункере. Стена Мария держит."],roll:["Кубик брошен! Судьба решена.","Бросок... стол дрожит, как от Колоссального."]};
function say(k){const a=Q[k];$("#note").textContent=a[Math.floor(Math.random()*a.length)]}
let closed=new Set(),secret=null,picking=false;
function render(){
 $("#grid").innerHTML=SERIES.chars.map((c,i)=>`<button class="card" data-i="${i}" style="--r:${((i*37)%7-3)*.6}deg">${face(c)}<div class="flap">?<small>ЗАКРЫТО</small></div></button>`).join("");
 update();
}
function setSecret(i){
 secret=i;picking=false;closed=new Set();
 $("#secret").classList.remove("hidden");$("#peek").textContent="Скрыть";
 $("#secret").innerHTML=face(SERIES.chars[i]);say("pick");
 render();
}
function update(){
 const cards=[...document.querySelectorAll(".card")],left=SERIES.chars.length-closed.size;
 cards.forEach((el,i)=>{el.classList.toggle("closed",closed.has(i));el.classList.toggle("last",!picking&&left===1&&!closed.has(i))});
 $("#grid").classList.toggle("picking",picking);
 $("#left").textContent=left;
 const m=$("#msg");m.textContent="";
 if(photoMode)$("#hint").textContent="Режим фото: кликните по карточке и выберите файл с картинкой.";
 else if(picking)$("#hint").textContent="Кликните по карточке, чтобы загадать этого персонажа.";
 else if(secret===null)$("#hint").textContent="Выберите персонажа сами или нажмите «Случайный».";
 else $("#hint").textContent="Кликайте по карточкам, чтобы закрыть неподходящих.";
 if(!picking&&left===1){const i=cards.findIndex((_,k)=>!closed.has(k));m.textContent="Это "+SERIES.chars[i].n+"!"}
 else if(left===0)m.textContent="Все закрыты — откройте кого-нибудь.";
}
$("#grid").addEventListener("click",e=>{
 const el=e.target.closest(".card");if(!el)return;
 const i=+el.dataset.i;
 if(photoMode){pending=i;$("#file").click();return}
 if(picking){setSecret(i);return}
 closed.has(i)?closed.delete(i):closed.add(i);update();say(closed.has(i)?"close":"open");
});
$("#pick").onclick=()=>{picking=true;update()};
$("#rand").onclick=()=>{const d=$("#dice");d.classList.add("roll");say("roll");setTimeout(()=>{d.classList.remove("roll");setSecret(Math.floor(Math.random()*SERIES.chars.length))},700)};
$("#reset").onclick=()=>{closed=new Set();update()};
$("#peek").onclick=()=>{const h=$("#secret").classList.toggle("hidden");$("#peek").textContent=h?"Показать":"Скрыть"};
let photoMode=false,pending=null;
try{const st=JSON.parse(localStorage.getItem("aot-photos")||"{}");SERIES.chars.forEach(c=>{if(st[c.n])c.img=st[c.n]})}catch(e){}
function savePhotos(){try{const o={};SERIES.chars.forEach(c=>{if(c.img&&(c.img.startsWith("data:")||c.img.startsWith("http")))o[c.n]=c.img});localStorage.setItem("aot-photos",JSON.stringify(o))}catch(e){}}
$("#photo").onclick=()=>{photoMode=!photoMode;$("#photo").textContent=photoMode?"Готово":"Загрузить фото";update()};
$("#file").onchange=e=>{
 const f=e.target.files[0];e.target.value="";if(!f||pending===null)return;
 const i=pending;pending=null;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const W=240,H=288,cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;
  x.drawImage(im,(W-w)/2,(H-h)/4,w,h);
  SERIES.chars[i].img=cv.toDataURL("image/jpeg",.82);savePhotos();render();
  if(secret===i)$("#secret").innerHTML=face(SERIES.chars[i]);
 };im.src=r.result};r.readAsDataURL(f);
};
$("#secret").innerHTML='<div class="empty">Персонаж ещё не загадан</div>';
render();
</script>
</body>
</html>
